# Mono square for tmux: source-file ~/.config/tmux/mono-square.conf  (generated by mono-ui from tokens/mono.json -- edit the tokens, not this file)
set -g status-style "bg=#0a0a0a,fg=#919191"
set -g status-left-style "bg=#e2e2e2,fg=#0a0a0a,bold"
set -g status-left " #S "
set -g status-right-style "fg=#919191"
set -g status-right " %H:%M "
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "
set -g window-status-style "fg=#787878"
set -g window-status-current-style "bg=#101010,fg=#ffffff,bold"
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#e2e2e2"
set -g message-style "bg=#101010,fg=#e2e2e2"
set -g message-command-style "bg=#101010,fg=#e2e2e2"
set -g mode-style "bg=#313131,fg=#ffffff"
set -g display-panes-active-colour "#ffffff"
set -g display-panes-colour "#787878"
set -g clock-mode-colour "#e2e2e2"
