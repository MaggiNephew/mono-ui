# Mono paper for tmux: source-file ~/.config/tmux/mono-paper.conf  (generated by mono-ui from tokens/mono.json -- edit the tokens, not this file)
set -g status-style "bg=#f2f2f2,fg=#5c5c5c"
set -g status-left-style "bg=#111111,fg=#f2f2f2,bold"
set -g status-left " #S "
set -g status-right-style "fg=#5c5c5c"
set -g status-right " %H:%M "
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "
set -g window-status-style "fg=#858585"
set -g window-status-current-style "bg=#e9e9e9,fg=#000000,bold"
set -g pane-border-style "fg=#bcbcbc"
set -g pane-active-border-style "fg=#111111"
set -g message-style "bg=#e9e9e9,fg=#111111"
set -g message-command-style "bg=#e9e9e9,fg=#111111"
set -g mode-style "bg=#d2d2d2,fg=#000000"
set -g display-panes-active-colour "#000000"
set -g display-panes-colour "#858585"
set -g clock-mode-colour "#111111"
