# Mono blend for tmux: source-file ~/.config/tmux/mono-blend.conf  (generated by mono-ui from tokens/mono.json -- edit the tokens, not this file)
set -g status-style "bg=#131313,fg=#919191"
set -g status-left-style "bg=#ffffff,fg=#131313,bold"
set -g status-left " #S "
set -g status-right-style "fg=#919191"
set -g status-right " %H:%M "
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "
set -g window-status-style "fg=#777777"
set -g window-status-current-style "bg=#1f1f1f,fg=#ffffff,bold"
set -g pane-border-style "fg=#343434"
set -g pane-active-border-style "fg=#e2e2e2"
set -g message-style "bg=#1f1f1f,fg=#e2e2e2"
set -g message-command-style "bg=#1f1f1f,fg=#e2e2e2"
set -g mode-style "bg=#383838,fg=#ffffff"
set -g display-panes-active-colour "#ffffff"
set -g display-panes-colour "#777777"
set -g clock-mode-colour "#e2e2e2"
