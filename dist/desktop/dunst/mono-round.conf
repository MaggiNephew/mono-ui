# Mono round for dunst: copy into ~/.config/dunst/dunstrc.d/  (generated by mono-ui from tokens/mono.json -- edit the tokens, not this file)
[global]
    font = "3270 Nerd Font Mono 11"
    frame_width = 1
    frame_color = "#919191"
    separator_color = frame
    corner_radius = 12
    padding = 10
    horizontal_padding = 12
    highlight = "#e2e2e2"
    progress_bar_frame_width = 0
    progress_bar_corner_radius = 2

[urgency_low]
    background = "#131313"
    foreground = "#999999"
    frame_color = "#333333"

[urgency_normal]
    background = "#131313"
    foreground = "#e2e2e2"
    frame_color = "#919191"

[urgency_critical]
    background = "#ffffff"
    foreground = "#1b1b1b"
    frame_color = "#ffffff"
