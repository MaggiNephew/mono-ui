# Mono square for dunst: copy into ~/.config/dunst/dunstrc.d/  (generated by mono-ui from tokens/mono.json -- edit the tokens, not this file)
[global]
    font = "Space Grotesk 11"
    frame_width = 1
    frame_color = "#656565"
    separator_color = frame
    corner_radius = 0
    padding = 10
    horizontal_padding = 12
    highlight = "#e2e2e2"
    progress_bar_frame_width = 0
    progress_bar_corner_radius = 0

[urgency_low]
    background = "#0a0a0a"
    foreground = "#919191"
    frame_color = "#3a3a3a"

[urgency_normal]
    background = "#0a0a0a"
    foreground = "#e2e2e2"
    frame_color = "#656565"

[urgency_critical]
    background = "#e2e2e2"
    foreground = "#0a0a0a"
    frame_color = "#e2e2e2"
