# Mono blend for dunst: copy into ~/.config/dunst/dunstrc.d/  (generated by mono-ui from tokens/mono.json -- edit the tokens, not this file)
[global]
    font = "Space Grotesk 11"
    frame_width = 1
    frame_color = "#5e5e5e"
    separator_color = frame
    corner_radius = 10
    padding = 10
    horizontal_padding = 12
    highlight = "#e2e2e2"
    progress_bar_frame_width = 0
    progress_bar_corner_radius = 2

[urgency_low]
    background = "#131313"
    foreground = "#919191"
    frame_color = "#343434"

[urgency_normal]
    background = "#131313"
    foreground = "#e2e2e2"
    frame_color = "#5e5e5e"

[urgency_critical]
    background = "#ffffff"
    foreground = "#131313"
    frame_color = "#ffffff"
