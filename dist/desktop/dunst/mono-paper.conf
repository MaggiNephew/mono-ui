# Mono paper for dunst: copy into ~/.config/dunst/dunstrc.d/  (generated by mono-ui from tokens/mono.json -- edit the tokens, not this file)
[global]
    font = "Space Grotesk 11"
    frame_width = 1
    frame_color = "#868686"
    separator_color = frame
    corner_radius = 0
    padding = 10
    horizontal_padding = 12
    highlight = "#111111"
    progress_bar_frame_width = 0
    progress_bar_corner_radius = 0

[urgency_low]
    background = "#f2f2f2"
    foreground = "#5c5c5c"
    frame_color = "#bcbcbc"

[urgency_normal]
    background = "#f2f2f2"
    foreground = "#111111"
    frame_color = "#868686"

[urgency_critical]
    background = "#111111"
    foreground = "#f2f2f2"
    frame_color = "#111111"
